<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 320"
     width="1200"
     height="320"
     style="background:#071426">

    <metadata><![CDATA[{"width":1200,"height":320,"backgroundColor":"#071426","avatarUrl":"https://avatars.githubusercontent.com/u/143958819?v=4","avatarSize":90,"particleCount":10,"particleColor":"#d9ecfb","waveColorStart":"#18334b","waveColorMid":"#376988","waveColorEnd":"#b99462","glowColorStart":"#c7a771","glowColorMid":"#f1dfb6","glowColorEnd":"#d6efff","borderEnabled":false,"borderColor":"#f59e0b","borderRadius":2,"borderSize":2,"meteors":[{"id":"1","iconSlug":"ph:shooting-star","iconColor":"#f1dfb6","trailColor":"#9fd5f2","startX":100,"angle":75,"duration":10,"delay":0}]}]]></metadata>

    <defs>
        <!-- Glow -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Stronger glow for meteors -->
        <filter id="meteorGlow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Gradient for waves -->
        <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#18334b"/>
            <stop offset="50%" stop-color="#376988"/>
            <stop offset="100%" stop-color="#b99462"/>
        </linearGradient>

        <!-- Gradient for glowing circle -->
        <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#c7a771"/>
            <stop offset="50%" stop-color="#f1dfb6"/>
            <stop offset="100%" stop-color="#d6efff"/>
        </linearGradient>

        <!-- Meteor trail gradients -->
        
        <linearGradient id="trail-1" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#9fd5f2" stop-opacity="0"/>
            <stop offset="100%" stop-color="#9fd5f2" stop-opacity="1"/>
        </linearGradient>
        <filter id="iconColor-1" color-interpolation-filters="sRGB">
            <feColorMatrix type="matrix" values="0 0 0 0 0.945 0 0 0 0 0.875 0 0 0 0 0.714 0 0 0 1 0"/>
        </filter>

        <linearGradient id="trail-2" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3178C6" stop-opacity="0"/>
            <stop offset="100%" stop-color="#3178C6" stop-opacity="1"/>
        </linearGradient>

        <linearGradient id="trail-3" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
        </linearGradient>

        <!-- Circle clip for avatar -->
        <clipPath id="avatarClip">
            <circle cx="600" cy="160" r="45"/>
        </clipPath>
    </defs>

    <!-- Background waves -->
    <path d="M0 160 Q150 128 300 160 T600 160 T900 160 T1200 160"
          fill="none"
          stroke="url(#waveGrad)"
          stroke-width="2"
          opacity="0.5">
        <animate attributeName="d"
                 dur="6s"
                 repeatCount="indefinite"
                 values="
             M0 160 Q150 128 300 160 T600 160 T900 160 T1200 160;
             M0 160 Q150 192 300 160 T600 160 T900 160 T1200 160;
             M0 160 Q150 128 300 160 T600 160 T900 160 T1200 160"/>
    </path>

    <!-- ========== METEOR LOGOS ========== -->
    
            <!-- ph:shooting-star Meteor -->
            <g filter="url(#meteorGlow)" visibility="hidden">
                <line x1="100" y1="-50" x2="112.94095225512604" y2="-1.7037086855465873" stroke="url(#trail-1)" stroke-width="2" stroke-linecap="round">
                    <animate attributeName="x1" values="100;221.64495119818474" dur="10s" repeatCount="indefinite" begin="0s"/>
                    <animate attributeName="y1" values="-50;403.9851383558621" dur="10s" repeatCount="indefinite" begin="0s"/>
                    <animate attributeName="x2" values="112.94095225512604;234.58590345331078" dur="10s" repeatCount="indefinite" begin="0s"/>
                    <animate attributeName="y2" values="-1.7037086855465873;452.2814296703155" dur="10s" repeatCount="indefinite" begin="0s"/>
                </line>
                <image href="data:image/svg+xml;base64," width="32" height="32" x="96.94095225512604" y="-17.703708685546587" filter="url(#iconColor-1)">
                    <animate attributeName="x" values="96.94095225512604;218.58590345331078" dur="10s" repeatCount="indefinite" begin="0s"/>
                    <animate attributeName="y" values="-17.703708685546587;436.2814296703155" dur="10s" repeatCount="indefinite" begin="0s"/>
                </image>
                <set attributeName="visibility" to="visible" begin="0s"/>
            </g>

            <image
            href="data:image/webp;base64,"
            x="555" y="115"
            width="90" height="90"
            clip-path="url(#avatarClip)"
            preserveAspectRatio="xMidYMid slice" />

    <circle cx="600" cy="160" r="45"
            fill="none"
            stroke="url(#glowGrad)"
            stroke-width="3"
            filter="url(#glow)">
        <animate attributeName="r"
                 values="40;50;40"
                 dur="2.5s"
                 repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="0.6;1;0.6"
                 dur="2.5s"
                 repeatCount="indefinite"/>
    </circle>

    <g transform="translate(600 160)">
        <circle cx="0" cy="0" r="60"
                fill="none"
                stroke="url(#glowGrad)"
                stroke-width="2"
                stroke-dasharray="6 4"
                filter="url(#glow)">
            <animateTransform
                    attributeName="transform"
                    type="rotate"
                    from="0"
                    to="360"
                    dur="10s"
                    repeatCount="indefinite"/>
        </circle>
    </g>

    <!-- Floating particles -->
    <g fill="#d9ecfb" opacity="0.8">
        
        <circle cx="120" cy="256" r="2">
            <animate attributeName="cy" values="256;64" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="324" cy="80" r="2">
            <animate attributeName="cy" values="80;288" dur="6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="120" cy="256" r="2">
            <animate attributeName="cy" values="256;64" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="645" cy="80" r="2">
            <animate attributeName="cy" values="80;288" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="409" cy="256" r="2">
            <animate attributeName="cy" values="256;64" dur="6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="644" cy="80" r="2">
            <animate attributeName="cy" values="80;288" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="936" cy="256" r="2">
            <animate attributeName="cy" values="256;64" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="666" cy="80" r="2">
            <animate attributeName="cy" values="80;288" dur="6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1080" cy="256" r="2">
            <animate attributeName="cy" values="256;64" dur="7s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
        </circle>
        <circle cx="1023" cy="80" r="2">
            <animate attributeName="cy" values="80;288" dur="5s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
        </circle>
    </g>

    
</svg>