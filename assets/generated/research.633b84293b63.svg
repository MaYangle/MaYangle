<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-labelledby="research-title research-desc">
<title id="research-title">Multimodal sentiment research architecture</title><desc id="research-desc">Frozen text, audio, and vision features pass through masked branches, cross-attention, policy routing, and scalar sentiment prediction. A training-only teacher distills the deployment policy.</desc><style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4eee3}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{fill:#a7a9ab}.amber{fill:#f1ae54}.line{stroke:#71685d;stroke-opacity:.46}.signal{fill:none;stroke:#f1ae54;stroke-width:1.2;stroke-dasharray:3 10;stroke-linecap:round}@keyframes orbit{to{stroke-dashoffset:-52}}.signal{animation:orbit 9s linear infinite}@media(prefers-reduced-motion:reduce){.signal{animation:none}}
</style><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f1ae54" stroke-width="1"/></marker></defs><rect width="960" height="190" rx="10" fill="#0b0d11"/><text x="28" y="35" font-size="12" letter-spacing="1.7" class="amber">MULTIMODAL SENTIMENT / MODEL PATH</text><text x="932" y="35" text-anchor="end" font-size="12" class="muted mono">RESEARCH OVERVIEW</text><path d="M183 101H203" class="signal" marker-end="url(#arrow)"/><path d="M360 101H380" class="signal" marker-end="url(#arrow)"/><path d="M534 101H554" class="signal" marker-end="url(#arrow)"/><path d="M712 101H732" class="signal" marker-end="url(#arrow)"/><g><rect x="28" y="72" width="150" height="59" rx="5" fill="#111318" stroke="#48464a"/><text x="103" y="96" text-anchor="middle" font-size="15" font-weight="550">Frozen T / A / V</text><text x="103" y="117" text-anchor="middle" font-size="13" class="muted">features</text></g><g><rect x="210" y="72" width="145" height="59" rx="5" fill="#111318" stroke="#48464a"/><text x="282.5" y="96" text-anchor="middle" font-size="15" font-weight="550">Masked branches</text><text x="282.5" y="117" text-anchor="middle" font-size="13" class="muted">modality paths</text></g><g><rect x="387" y="72" width="142" height="59" rx="5" fill="#111318" stroke="#48464a"/><text x="458" y="96" text-anchor="middle" font-size="15" font-weight="550">Cross-attention</text><text x="458" y="117" text-anchor="middle" font-size="13" class="muted">feature exchange</text></g><g><rect x="561" y="72" width="146" height="59" rx="5" fill="#111318" stroke="#48464a"/><text x="634" y="96" text-anchor="middle" font-size="15" font-weight="550">Policy routing</text><text x="634" y="117" text-anchor="middle" font-size="13" class="muted">selective fusion</text></g><g><rect x="739" y="72" width="193" height="59" rx="5" fill="#111318" stroke="#a97b45"/><text x="835.5" y="96" text-anchor="middle" font-size="15" font-weight="550">Scalar sentiment</text><text x="835.5" y="117" text-anchor="middle" font-size="13" class="muted">prediction</text></g><text x="28" y="166" font-size="13" class="muted">TRAIN-only teacher distills deployment policy</text><path d="M420 162H932" class="line"/></svg>