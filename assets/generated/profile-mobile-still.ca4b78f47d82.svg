acity=".24"/><circle cx="520.9" cy="649.5" r="0.8" fill="#aca8c6" opacity=".42"/><circle cx="537.3" cy="645.8" r="0.8" fill="#788fae" opacity=".24"/><circle cx="553.6" cy="642.3" r="0.8" fill="#aca8c6" opacity=".24"/><circle cx="570.0" cy="639.3" r="0.8" fill="#788fae" opacity=".42"/><text x="30" y="733" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">CURRENT RESEARCH DIRECTIONS</text><text x="30" y="770" font-size="20" fill="#26313d" font-weight="600"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion/blob/main/docs/ARCHITECTURE.md">Multimodal fusion</a></text><text x="30" y="797" font-size="19" fill="#788795" >Frozen text, audio and vision features; masked</text><text x="30" y="825" font-size="19" fill="#788795" >sequence fusion and modality routing.</text><text x="30" y="859" font-size="20" fill="#26313d" font-weight="600"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion/blob/main/docs/EXPERIMENTS.md">Evaluation &amp; ablations</a></text><text x="30" y="886" font-size="19" fill="#788795" >Matched controls, native dataset protocols and</text><text x="30" y="914" font-size="19" fill="#788795" >three-seed comparisons; negative results retained.</text><text x="30" y="948" font-size="20" fill="#26313d" font-weight="600"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion/blob/main/docs/REPRODUCING.md">Training systems</a></text><text x="30" y="975" font-size="19" fill="#788795" >Source-isolated selection, checkpoint resume, seeded</text><text x="30" y="1003" font-size="19" fill="#788795" >runs and independent replay.</text><path d="M30 1047L570 1047" fill="none" stroke="#e7edf2" /><text x="30" y="1091" font-size="31" fill="#26313d" font-weight="400">2</text><text x="30" y="1116" font-size="14" fill="#788795" >Open upstream PRs</text><text x="210" y="1091" font-size="31" fill="#26313d" font-weight="400">1</text><text x="210" y="1116" font-size="14" fill="#788795" >Merged repositories</text><path d="M190 1064L190 1130" fill="none" stroke="#e7edf2" /><text x="390" y="1091" font-size="31" fill="#26313d" font-weight="400">1</text><text x="390" y="1116" font-size="14" fill="#788795" >Public projects</text><path d="M370 1064L370 1130" fill="none" stroke="#e7edf2" /><path d="M30 1145L570 1145" fill="none" stroke="#e7edf2" /><path d="M30 2113L570 2113" fill="none" stroke="#e7edf2" /><text x="30" y="1193" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">SELECTED RESEARCH</text><text x="30" y="1237" font-size="25" fill="#26313d" font-weight="600"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion">Multimodal Sentiment Fusion</a></text><text x="30" y="1272" font-size="19" fill="#788795" >A Python/PyTorch research codebase for native</text><text x="30" y="1301" font-size="19" fill="#788795" >continuous sentiment prediction on CH-SIMS v2.0 and</text><text x="30" y="1330" font-size="19" fill="#788795" >CMU-MOSEI, with sequence fusion, matched controls,</text><text x="30" y="1359" font-size="19" fill="#788795" >resumable training and independent evaluation.</text><text x="30" y="1402" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">RESEARCH FLOW</text><text x="30" y="1430" font-size="17" fill="#788795" letter-spacing=".8">TEXT</text><path d="M117 1425C273.59999999999997 1425 303.59999999999997 1460 348.59999999999997 1460" fill="none" stroke="#788fae" stroke-opacity=".32"/><text x="30" y="1460" font-size="17" fill="#788795" letter-spacing=".8">AUDIO</text><path d="M117 1455C273.59999999999997 1455 303.59999999999997 1460 348.59999999999997 1460" fill="none" stroke="#788fae" stroke-opacity=".32"/><text x="30" y="1490" font-size="17" fill="#788795" letter-spacing=".8">VISION</text><path d="M117 1485C273.59999999999997 1485 303.59999999999997 1460 348.59999999999997 1460" fill="none" stroke="#788fae" stroke-opacity=".32"/><circle cx="348.59999999999997" cy="1460" r="4" fill="#788fae"/><text x="348.59999999999997" y="1494" font-size="17" fill="#788fae" text-anchor="middle">FUSION</text><path d="M357.59999999999997 1460H566" fill="none" stroke="#788fae" stroke-opacity=".4" /><text x="566" y="1444" font-size="17" fill="#788795" text-anchor="end">SENTIMENT</text><path d="M30 1541L570 1541" fill="none" stroke="#e7edf2" /><text x="30" y="1575" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">VALID STUDY · 2026-10-14 UTC</text><text x="30" y="1606" font-size="19" fill="#26313d" >CH-SIMS v2.0 sequence-routing study: 27/27 fits</text><text x="30" y="1635" font-size="19" fill="#26313d" >completed, including 21 fusion fits across 7 arms and</text><text x="30" y="1664" font-size="19" fill="#26313d" >3 seeds.</text><text x="30" y="1698" font-size="19" fill="#788795" >Distilled post-normalization candidate</text><text x="30" y="1732" font-size="28" fill="#788fae" font-weight="400" letter-spacing=".2">0.378497 ± 0.007455</text><text x="30" y="1772" font-size="19" fill="#788795" >Matched distilled-static control</text><text x="30" y="1806" font-size="28" fill="#788fae" font-weight="400" letter-spacing=".2">0.378253 ± 0.008851</text><text x="30" y="1859" font-size="18" fill="#788795" >Development VALID only; native clipped MAE, lower is</text><text x="30" y="1886" font-size="18" fill="#788795" >better. Mean ± sample SD over seeds 13 / 42 / 2026.</text><text x="30" y="1913" font-size="18" fill="#788795" >Final TEST remains independent.</text><text x="30" y="1945" font-size="18" fill="#26313d" >The candidate did not pass the preregistered promotion</text><text x="30" y="1972" font-size="18" fill="#26313d" >gate; a consistent routing gain has not been</text><text x="30" y="1999" font-size="18" fill="#26313d" >established.</text><text x="30" y="2029" font-size="16" fill="#788795" >Open research gates: fresh full repetition, author-media</text><text x="30" y="2052" font-size="16" fill="#788795" >verification, native MOSEI method replication and final TEST</text><text x="30" y="2075" font-size="16" fill="#788795" >evaluation.</text><text x="30" y="2135" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">UPSTREAM CONTRIBUTIONS</text><text x="30" y="2178" font-size="23" fill="#26313d" font-weight="600"><a href="https://github.com/19376357/Bilingual-Multimodal-Sentiment-Analysis">Bilingual Multimodal Sentiment Analysis</a></text><text x="30" y="2210" font-size="18" fill="#788fae" font-weight="600">6 merged · 0 open · 1 closed without merge</text><text x="30" y="2239" font-size="19" fill="#788795" >Fixed missing-face features, single-sample output</text><text x="30" y="2267" font-size="19" fill="#788795" >handling and non-finite predictions; added English</text><text x="30" y="2295" font-size="19" fill="#788795" >and Chinese README documentation.</text><circle cx="33" cy="2321" r="2.5" fill="#788fae"/><text x="48" y="2326" font-size="18" fill="#26313d" font-weight="400"><a href="https://github.com/19376357/Bilingual-Multimodal-Sentiment-Analysis/pull/7">Reliability fixes · merged PR #7 · 2025-08-31 UTC</a></text><circle cx="33" cy="2353" r="2.5" fill="#788fae"/><text x="48" y="2358" font-size="18" fill="#26313d" font-weight="400"><a href="https://github.com/19376357/Bilingual-Multimodal-Sentiment-Analysis/pull/5">Documentation · merged PR #5 · 2025-08-27 UTC</a></text><text x="30" y="2420" font-size="23" fill="#26313d" font-weight="600"><a href="https://github.com/rohitg00/ai-engineering-from-scratch">AI Engineering from Scratch</a></text><text x="30" y="2452" font-size="18" fill="#788fae" >0 merged · 2 open · 1 closed without merge</text><path d="M30 2491L570 2491" fill="none" stroke="#e7edf2" /><text x="30" y="2525" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">RECENT UPSTREAM ACTIVITY</text><text x="30" y="2558" font-size="13" fill="#788795" letter-spacing=".35">2026-10-10 UTC  ·  OPEN</text><text x="30" y="2585" font-size="19" fill="#26313d" font-weight="400"><a href="https://github.com/rohitg00/ai-engineerin