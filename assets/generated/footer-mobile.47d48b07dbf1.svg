<svg xmlns="http://www.w3.org/2000/svg" width="600" height="49" viewBox="0 0 600 49" role="img" aria-labelledby="title"><title id="title">Public GitHub data refresh date</title><style>text{font-family:Arial,Helvetica,sans-serif}.wave{animation:wave 12s ease-in-out infinite}.flow{animation:flow 6s linear infinite}.core{transform-box:fill-box;transform-origin:center;animation:corePulse 3.2s ease-in-out infinite}@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes corePulse{0%,100%{transform:scale(.94);opacity:.78}50%{transform:scale(1.08);opacity:1}}@media(prefers-reduced-motion:reduce){.wave,.flow,.core{animation:none!important}}</style><rect width="600" height="49" fill="#fff"/><path d="M30 1L570 1" stroke="#e1e7ed" fill="none"/><text x="30" y="31" font-size="18" fill="#667583" letter-spacing="1">PUBLIC GITHUB DATA</text><text x="570" y="31" font-size="18" fill="#667583" text-anchor="end" letter-spacing=".5">UPDATED 11 OCT 2026</text></svg>
