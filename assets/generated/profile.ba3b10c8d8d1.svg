e cx="481.5" cy="639.4" r="0.8" fill="#788fae" opacity=".42"/><circle cx="497.2" cy="637.1" r="1.5" fill="#aca8c6" opacity=".24"/><circle cx="513.0" cy="634.1" r="0.8" fill="#788fae" opacity=".24"/><circle cx="528.7" cy="630.5" r="0.8" fill="#aca8c6" opacity=".42"/><circle cx="544.5" cy="626.8" r="0.8" fill="#788fae" opacity=".24"/><circle cx="560.2" cy="623.3" r="0.8" fill="#aca8c6" opacity=".24"/><circle cx="576.0" cy="620.3" r="0.8" fill="#788fae" opacity=".42"/><text x="660" y="333" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">CURRENT RESEARCH DIRECTIONS</text><text x="660" y="376" font-size="18" fill="#26313d" font-weight="600"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion/blob/main/docs/ARCHITECTURE.md">Multimodal fusion</a></text><text x="660" y="404" font-size="17" fill="#788795" >Frozen text, audio and vision features; masked</text><text x="660" y="429" font-size="17" fill="#788795" >sequence fusion and modality routing.</text><text x="660" y="460" font-size="18" fill="#26313d" font-weight="600"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion/blob/main/docs/EXPERIMENTS.md">Evaluation &amp; ablations</a></text><text x="660" y="488" font-size="17" fill="#788795" >Matched controls, native dataset protocols and</text><text x="660" y="513" font-size="17" fill="#788795" >three-seed comparisons; negative results retained.</text><text x="660" y="544" font-size="18" fill="#26313d" font-weight="600"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion/blob/main/docs/REPRODUCING.md">Training systems</a></text><text x="660" y="572" font-size="17" fill="#788795" >Source-isolated selection, checkpoint resume, seeded</text><text x="660" y="597" font-size="17" fill="#788795" >runs and independent replay.</text><path d="M56 667L1144 667" fill="none" stroke="#e7edf2" /><text x="64" y="714" font-size="34" fill="#26313d" font-weight="400">2</text><text x="64" y="741" font-size="14" fill="#788795" >Open upstream PRs</text><text x="426.6666666666667" y="714" font-size="34" fill="#26313d" font-weight="400">1</text><text x="426.6666666666667" y="741" font-size="14" fill="#788795" >Merged repositories</text><path d="M398.6666666666667 684L398.6666666666667 750" fill="none" stroke="#e7edf2" /><text x="789.3333333333334" y="714" font-size="34" fill="#26313d" font-weight="400">1</text><text x="789.3333333333334" y="741" font-size="14" fill="#788795" >Public projects</text><path d="M761.3333333333334 684L761.3333333333334 750" fill="none" stroke="#e7edf2" /><path d="M56 765L1144 765" fill="none" stroke="#e7edf2" /><path d="M600 817L600 1652" fill="none" stroke="#edf0f4" /><text x="56" y="817" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">SELECTED RESEARCH</text><text x="56" y="861" font-size="23" fill="#26313d" font-weight="600"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion">Multimodal Sentiment Fusion</a></text><text x="56" y="896" font-size="17" fill="#788795" >A Python/PyTorch research codebase for native</text><text x="56" y="922" font-size="17" fill="#788795" >continuous sentiment prediction on CH-SIMS v2.0 and</text><text x="56" y="948" font-size="17" fill="#788795" >CMU-MOSEI, with sequence fusion, matched controls,</text><text x="56" y="974" font-size="17" fill="#788795" >resumable training and independent evaluation.</text><text x="56" y="1017" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">RESEARCH FLOW</text><text x="56" y="1045" font-size="15" fill="#788795" letter-spacing=".8">TEXT</text><path d="M143 1040C277.18 1040 307.18 1075 352.18 1075" fill="none" stroke="#788fae" stroke-opacity=".32"/><text x="56" y="1075" font-size="15" fill="#788795" letter-spacing=".8">AUDIO</text><path d="M143 1070C277.18 1070 307.18 1075 352.18 1075" fill="none" stroke="#788fae" stroke-opacity=".32"/><text x="56" y="1105" font-size="15" fill="#788795" letter-spacing=".8">VISION</text><path d="M143 1100C277.18 1100 307.18 1075 352.18 1075" fill="none" stroke="#788fae" stroke-opacity=".32"/><circle cx="352.18" cy="1075" r="4" fill="#788fae"/><text x="352.18" y="1109" font-size="15" fill="#788fae" text-anchor="middle">FUSION</text><path d="M361.18 1075H554" fill="none" stroke="#788fae" stroke-opacity=".4" stroke-dasharray="2 11" class="drift"/><text x="554" y="1059" font-size="15" fill="#788795" text-anchor="end">SENTIMENT</text><path d="M56 1156L558 1156" fill="none" stroke="#e7edf2" /><text x="56" y="1190" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">VALID STUDY · 2026-10-14 UTC</text><text x="56" y="1221" font-size="17" fill="#26313d" >CH-SIMS v2.0 sequence-routing study: 27/27 fits</text><text x="56" y="1247" font-size="17" fill="#26313d" >completed, including 21 fusion fits across 7 arms and 3</text><text x="56" y="1273" font-size="17" fill="#26313d" >seeds.</text><text x="56" y="1307" font-size="17" fill="#788795" >Distilled post-normalization candidate</text><text x="56" y="1341" font-size="26" fill="#788fae" font-weight="400" letter-spacing=".2">0.378497 ± 0.007455</text><text x="56" y="1381" font-size="17" fill="#788795" >Matched distilled-static control</text><text x="56" y="1415" font-size="26" fill="#788fae" font-weight="400" letter-spacing=".2">0.378253 ± 0.008851</text><text x="56" y="1468" font-size="16" fill="#788795" >Development VALID only; native clipped MAE, lower is</text><text x="56" y="1492" font-size="16" fill="#788795" >better. Mean ± sample SD over seeds 13 / 42 / 2026. Final</text><text x="56" y="1516" font-size="16" fill="#788795" >TEST remains independent.</text><text x="56" y="1548" font-size="16" fill="#26313d" >The candidate did not pass the preregistered promotion</text><text x="56" y="1572" font-size="16" fill="#26313d" >gate; a consistent routing gain has not been established.</text><text x="56" y="1602" font-size="14" fill="#788795" >Open research gates: fresh full repetition, author-media</text><text x="56" y="1622" font-size="14" fill="#788795" >verification, native MOSEI method replication and final TEST</text><text x="56" y="1642" font-size="14" fill="#788795" >evaluation.</text><text x="642" y="817" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">UPSTREAM CONTRIBUTIONS</text><text x="642" y="860" font-size="21" fill="#26313d" font-weight="600"><a href="https://github.com/19376357/Bilingual-Multimodal-Sentiment-Analysis">Bilingual Multimodal Sentiment Analysis</a></text><text x="642" y="892" font-size="16" fill="#788fae" font-weight="600">6 merged · 0 open · 1 closed without merge</text><text x="642" y="921" font-size="17" fill="#788795" >Fixed missing-face features, single-sample output</text><text x="642" y="946" font-size="17" fill="#788795" >handling and non-finite predictions; added English and</text><text x="642" y="971" font-size="17" fill="#788795" >Chinese README documentation.</text><circle cx="645" cy="997" r="2.5" fill="#788fae"/><text x="660" y="1002" font-size="16" fill="#26313d" font-weight="400"><a href="https://github.com/19376357/Bilingual-Multimodal-Sentiment-Analysis/pull/7">Reliability fixes · merged PR #7 · 2025-08-31 UTC</a></text><circle cx="645" cy="1025" r="2.5" fill="#788fae"/><text x="660" y="1030" font-size="16" fill="#26313d" font-weight="400"><a href="https://github.com/19376357/Bilingual-Multimodal-Sentiment-Analysis/pull/5">Documentation · merged PR #5 · 2025-08-27 UTC</a></text><text x="642" y="1088" font-size="21" fill="#26313d" font-weight="600"><a href="https://github.com/rohitg00/ai-engineering-from-scratch">AI Engineering from Scratch</a></text><text x="642" y="1120" font-size="16" fill="#788fae" >0 merged · 2 open · 1 closed without merge</text><path d="M642 1159L1144 1159" fill="none" stroke="#e7edf2" /><text x="642" y="1193" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">RECENT UPSTREAM ACTIVITY</text><text x="642" y="1226" font-size="12" fill="#788795" letter-spacing=".35">2026-10-10 UTC  ·  OPEN</text><text x="642" y="1249" font-size="17" fill="#26313d" font-weight="400"><a href="https://github.com/rohitg00/ai-engineering-from-scratch/pull/583">AI Engineering from Scratch #583 — feat(quizzes):</a></text><text x="642" y="1274.5" font-size="17" fill="#26313d" font-weight="400"><a href="https://github.com/rohitg00/ai-engineering-from-scratch/pull/583">backfill 150 missing lesson quizzes</a></text><text x="642" y="1294.5" font-size="12" fill="#788795" letter-spacing=".35">2026-10-09 UTC  ·  CLOSED WITHOUT MERGE</text><text x="642" y="1317.5" font-size="17" fill="#26313d" font-weight="400"><a href="https://github.com/rohitg00/ai-engineering-from-scratch/pull/531">AI Engineering from Scratch #531 — docs(i18n): complete</a></text><text x="642" y="1343" font-size="17" fill="#26313d" font-weight="400"><a href="https://github.com/rohitg00/ai-engineering-from-scratch/pull/531">and audit 12 README translations</a></text><text x="642" y="1363" font-size="12" fill="#788795" letter-spacing=".35">2026-10-04 UTC  ·  OPEN</text><text x="642" y="1386" font-size="17" fill="#26313d" font-weight="400"><a href="https://github.com/rohitg00/ai-engineering-from-scratch/pull/527">AI Engineering from Scratch #527 — docs: connect</a></text><text x="642" y="1411.5" font-size="17" fill="#26313d" font-weight="400"><a href="https://github.com/rohitg00/ai-engineering-from-scratch/pull/527">primary papers to existing lessons</a></text><path d="M56 1682L1144 1682" fill="none" stroke="#e7edf2" /><text x="56" y="1704" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">LATEST PROJECT COMMIT</text><text x="56" y="1736" font-size="14" fill="#788795" font-weight="400"><a href="https://github.com/MaYangle/Multimodal-Sentiment-Fusion/commit/74608094ea55b6f9aaa896831796105e3eee3c18">2026-10-14 UTC · MaYangle/Multimodal-Sentiment-Fusion · Record verified Linux CI and explain scientific audit gate failures</a></text><path d="M56 1768Q600 1740 1144 1768" fill="none" stroke="#dfe7e