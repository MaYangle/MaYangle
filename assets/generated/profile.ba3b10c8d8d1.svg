52 640" fill="none" stroke="#ccd7e6" stroke-opacity=".23" class="drift" stroke-dasharray="1 19"/><rect width="1200" height="1" fill="#fff"/><text x="56" y="48" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">PUBLIC BUILDER PROFILE</text><text x="1144" y="48" font-size="12" fill="#788795" text-anchor="end" letter-spacing=".8">@MaYangle</text><text x="56" y="126" font-size="64" fill="#26313d" font-weight="600" letter-spacing="-1.8">YANGLE MA</text><text x="56" y="168" font-size="22" fill="#788fae" ></text><text x="56" y="168" font-size="22" fill="#788fae" >AI engineer · Multimodal learning &amp; reproducible experiments</text><text x="56" y="210" font-size="17" fill="#788795" >I build and evaluate multimodal learning systems, from text/audio/vision pipelines to controlled fusion experiments. I</text><text x="56" y="235" font-size="17" fill="#788795" >care about reproducible runs, clear evaluation boundaries and useful upstream fixes.</text><path d="M56 287L1144 287" fill="none" stroke="#e7edf2" /><text x="56" y="330" font-size="12" fill="#788795" font-weight="600" letter-spacing="1.55">CONTRIBUTION RECORD</text><circle cx="222" cy="496" r="106" fill="#fbfcff" fill-opacity=".6" stroke="#e8edf3" stroke-width="1"/><circle cx="222" cy="496" r="106" fill="none" stroke="#788fae" stroke-opacity=".52" stroke-width="1.4" stroke-dasharray="514.0999999999999 159" transform="rotate(130 222 496)"/><circle cx="222" cy="496" r="114" fill="none" stroke="#aca8c6" stroke-opacity=".3" stroke-width="1" stroke-dasharray="2 17" class="orbit"/><text x="222" y="525" font-size="116" fill="#788fae" text-anchor="middle" font-weight="400" letter-spacing="-5">06</text><text x="222" y="566" font-size="12" fill="#788795" text-anchor="middle" letter-spacing="1.1">MERGED UPSTREAM PRS</text><path d="M56 633 C175.60000000000002 601 300.4 650 420 627 S524 610 576 631" fill="none" stroke="#788fae" stroke-opacity=".12" stroke-width="1.2"/><path d="M56 633 C175.60000000000002 601 300.