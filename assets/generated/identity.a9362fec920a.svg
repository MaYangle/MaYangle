<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="181" viewBox="0 0 1200 181" role="img" aria-labelledby="title"><title id="title">Yangle Ma — AI engineer</title><style>text{font-family:Arial,Helvetica,sans-serif}.wave{animation:wave 12s ease-in-out infinite}.flow{animation:flow 6s linear infinite}.core{transform-box:fill-box;transform-origin:center;animation:corePulse 3.2s ease-in-out infinite}@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}@keyframes flow{to{stroke-dashoffset:-100}}@keyframes corePulse{0%,100%{transform:scale(.94);opacity:.78}50%{transform:scale(1.08);opacity:1}}@media(prefers-reduced-motion:reduce){.wave,.flow,.core{animation:none!important}}</style><rect width="1200" height="181" fill="#fff"/><text x="56" y="35" font-size="17" fill="#667583" font-weight="600" letter-spacing="1.1">PROFILE</text><text x="1144" y="35" font-size="16" fill="#667583" text-anchor="end">@MaYangle</text><text x="56" y="116" font-size="66" fill="#17232f" font-weight="600" letter-spacing="-1.8">YANGLE MA</text><text x="56" y="157" font-size="24" fill="#4264e8" letter-spacing="-.2">AI engineer</text></svg>
