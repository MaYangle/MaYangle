<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="research-title research-desc"><title id="research-title">Multimodal sentiment research architecture</title><desc id="research-desc">Frozen text, audio, and vision features pass through masked branches, cross-attention, policy routing, and scalar sentiment prediction. A training-only teacher distills the deployment policy.</desc><style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#f4eee3}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{fill:#a7a9ab}.amber{fill:#f1ae54}.line{stroke:#71685d;stroke-opacity:.46}.signal{fill:none;stroke:#f1ae54;stroke-width:1.2;stroke-dasharray:3 10;stroke-linecap:round}@keyframes orbit{to{stroke-dashoffset:-52}}.signal{animation:orbit 9s linear infinite}@media(prefers-reduced-motion:reduce){.signal{animation:none}}
</style><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#f1ae54" stroke-width="1"/></marker></defs><rect width="480" height="320" rx="10" fill="#0b0d11"/><text x="24" y="29" font-size="12" letter-spacing="1.3" class="amber">MULTIMODAL SENTIMENT / MODEL PATH</text><g><rect x="78" y="52" width="324" height="34" rx="4" fill="#111318" stroke="#48464a"/><text x="240" y="75" text-anchor="middle" font-size="15">Frozen T / A / V features</text></g><path d="M240 86V94" class="signal" marker-end="url(#arrow)"/><g><rect x="78" y="94" width="324" height="34" rx="4" fill="#111318" stroke="#48464a"/><text x="240" y="117" text-anchor="middle" font-size="15">Masked branches</text></g><path d="M240 128V136" class="signal" marker-end="url(#arrow)"/><g><rect x="78" y="136" width="324" height="34" rx="4" fill="#111318" stroke="#48464a"/><text x="240" y="159" text-anchor="middle" font-size="15">Cross-attention</text></g><path d="M240 170V178" class="signal" marker-end="url(#arrow)"/><g><rect x="78" y="178" width="324" height="34" rx="4" fill="#111318" stroke="#48464a"/><text x="240" y="201" text-anchor="middle" font-size="15">Policy routing</text></g><path d="M240 212V220" class="signal" marker-end="url(#arrow)"/><g><rect x="78" y="220" width="324" height="34" rx="4" fill="#111318" stroke="#a97b45"/><text x="240" y="243" text-anchor="middle" font-size="15">Scalar sentiment</text></g><text x="24" y="302" font-size="13" class="muted">TRAIN-only teacher distills deployment policy</text></svg>