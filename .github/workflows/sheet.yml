name: Refresh profile sheet

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/sheet.yml'

permissions:
  contents: write

concurrency:
  group: refresh-sheet
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Render sheet from live data
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if the sheet changed
        run: |
          git add assets/sheet.svg assets/sheet-mobile.svg
          if git diff --cached --quiet; then
            echo "sheet unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile sheet [skip ci]'
          git push
