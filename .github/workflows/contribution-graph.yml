name: Update contribution graph

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: MaYangle
          outputs: |
            dist/contribution-snake.svg?color_snake=%232f5d7c&color_dots=%23ebf1f5,%23d6e4ee,%23abc9dc,%237595ad,%23435f78
            dist/contribution-snake-dark.svg?palette=github-dark

      - name: Publish graph assets
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
          force_orphan: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
