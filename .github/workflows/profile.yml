name: Refresh profile

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile.config.json'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/profile.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check generation behavior
        run: node --test
      - name: Refresh public GitHub data and render the profile
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changed profile files
        run: |
          git add README.md assets/generated data/profile.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile data [skip ci]'
          git push
