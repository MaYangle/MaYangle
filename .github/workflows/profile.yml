name: Refresh and validate profile

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'profile.config.json'
      - 'scripts/**'
      - 'assets/art/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/profile.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test collector, renderer and refresh safety
        run: node --test
      - name: Verify saved snapshot renders consistently
        run: |
          node scripts/update-profile.mjs --offline
          git diff --exit-code -- README.md data/activity.json assets/generated
  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: refresh-profile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Collect public GitHub data and render
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changed public snapshot and profile
        run: |
          git add README.md data/activity.json assets/generated
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public profile data [skip ci]'
          git push
